name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]

jobs:
  build:
    name: Build Play APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Create temporary release keystore
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias \
            -storepass password -keypass password -keyalg RSA -validity 10000 \
            -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Build debug and release
        run: ./gradlew assemblePlayDebug assemblePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-play-debug.apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-play-release.apk
          path: app/build/outputs/apk/play/release/app-play-release.apk
